name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.4.1
          base="https://downloads.godotengine.org/?version=${version}&flavor=stable"
          curl -fL --retry 3 "${base}&platform=linux.64&slug=linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/Godot_v${version}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          curl -fL --retry 3 "${base}&platform=templates&slug=export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${version}.stable"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/*' -d "$HOME/.local/share/godot/export_templates/${version}.stable"
          test -s "$HOME/.local/share/godot/export_templates/${version}.stable/android_debug.apk"

      - name: Prepare Android SDK and debug keystore
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" \
            'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' || test "${PIPESTATUS[1]}" -eq 0
          mkdir -p "$HOME/.android" "$HOME/.config/godot" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          SETTINGS

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then
            exit 1
          fi

      - name: Export signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --verbose --path . --export-debug Android build/VALE-2-preview.apk 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s build/VALE-2-preview.apk
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:.*(export|Export)' "$RUNNER_TEMP/export.log"; then
            exit 1
          fi
          aapt="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0/aapt"
          "$aapt" dump permissions build/VALE-2-preview.apk | grep 'android.permission.INTERNET'
          sha256sum build/VALE-2-preview.apk

      - name: Upload APK for download in Actions
        uses: actions/upload-artifact@v4
        with:
          name: VALE-2-Android-APK
          path: build/VALE-2-preview.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish preview on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v0.1.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/VALE-2-preview.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "VALE-2 Android preview ${GITHUB_RUN_NUMBER}" \
            --notes 'APK de teste para instalar em dois celulares na mesma rede Wi-Fi. Build de depuração; gameplay e rede precisam de validação nos aparelhos.'
