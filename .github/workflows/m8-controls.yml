name: M8 controls build and test

on:
  push:
    branches:
      - feat/m8-controls
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/m8-controls

      - name: Build current visual HTML
        run: python3 tools/build.py

      - name: Verify M8 is embedded without removing current art
        run: |
          grep -q "M8 CONTROLES PROFISSIONAIS" index.html
          grep -q "GameInput" index.html
          test -f assets/world.png
          test -f assets/human.png
          test -f assets/animal.png
          test -f assets/tile.png
          test -f assets/atlas.json
          test $(wc -c < index.html) -gt 2000000

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve game
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/vale2-http.log 2>&1 &
          echo $! > /tmp/vale2-http.pid
          sleep 2

      - name: Run M8 controls tests
        run: node tests/m8.cjs

      - name: Run prior regression tests
        run: |
          node tests/m0.cjs
          node tests/m1.cjs
          node tests/m2.cjs
          node tests/m3.cjs
          node tests/m4.cjs
          node tests/m5.cjs
          node tests/m6.cjs
          node tests/m7.cjs

      - name: Commit generated index
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: regenerate visual index with M8 controls"
            git push origin HEAD:feat/m8-controls
          fi
