function regionGrid(region=currentRegion()){if(region==='home'){const grid=new Uint8Array(ROOM.w*ROOM.h);for(let y=0;y<ROOM.h;y++)for(let x=0;x<ROOM.w;x++)if(x===0||y===0||x===ROOM.w-1||y===ROOM.h-1||ROOM.objects.some(o=>o.k!=='exit'&&o.x===x&&o.y===y))grid[y*ROOM.w+x]=1;return {grid,w:ROOM.w,h:ROOM.h}}return {grid:sol,w:MW,h:MH}}
function gridPath(a,target,region=currentRegion()){const base=regionGrid(region),w=base.w,h=base.h,grid=base.grid.slice();if(region===currentRegion()){const actors=[P,...(region==='farm'?N:[])];for(const o of actors){const k=Math.floor(o.y/T)*w+Math.floor(o.x/T);if(k>=0&&k<grid.length&&Math.hypot(o.x-a.x,o.y-a.y)>10)grid[k]=1}}const start=Math.floor(a.y/T)*w+Math.floor(a.x/T),parents=new Int32Array(grid.length);parents.fill(-2);if(start<0||start>=grid.length||grid[start])return [];parents[start]=-1;const queue=[start];let best=start,distance=Infinity;for(let i=0;i<queue.length;i++){const k=queue[i],x=k%w,y=k/w|0,d=Math.abs(x-target[0])+Math.abs(y-target[1]);if(d<distance){best=k;distance=d}if(d===0)break;for(const n of [x>0?k-1:-1,x<w-1?k+1:-1,y>0?k-w:-1,y<h-1?k+w:-1])if(n>=0&&!grid[n]&&parents[n]===-2){parents[n]=k;queue.push(n)}}const out=[];for(let k=best;k!==-1;k=parents[k])out.push([k%w*T+8,(k/w|0)*T+8]);return out.reverse()}
function safeTile(target,region=currentRegion(),avoid=true){const {grid,w,h}=regionGrid(region);for(let r=0;r<8;r++)for(let y=Math.max(1,target[1]-r);y<Math.min(h-1,target[1]+r+1);y++)for(let x=Math.max(1,target[0]-r);x<Math.min(w-1,target[0]+r+1);x++){const px=x*T+8,py=y*T+8;if(!grid[y*w+x]&&(!avoid||![P,...N].some(a=>Math.hypot(a.x-px,a.y-py)<12)))return [px,py]}return [7*T+8,8*T+8]}
function syncCompanionRegion(region){if(!story.flags.rainara_companion)return;if(companion.state==='follow'||companion.scene){companion.region=region;const pos=safeTile([Math.floor(P.x/T)+1,Math.floor(P.y/T)],region);companion.x=pos[0];companion.y=pos[1];companion.path=[];companion.nav=-1}if(companion.task)cancelCompanionTask('Mudança de lugar')}

function cancelCompanionTask(reason){finishTask(reason||'Cancelada')}
function finishCompanionDay(){if(companion.task)finishTask('Encerrada para descansar');companion.state='routine'}
function updateTask(dt){const t=companion.task;if(!t||t.paused)return;if(!t.targets.length||t.done>= (t.kind==='water'?8:t.kind==='feed'?3:6)){finishTask();return}const target=t.targets[0],a=target.animal?farm.animals.find(a=>a.id===target.animal):null;if(a){target.x=Math.floor(a.x/T);target.y=Math.floor(a.y/T)}const k=target.k,c=cr[k];if((target.animal&&!a)||(t.kind==='water'&&(!c||c.w))||(t.kind==='harvest'&&(!c||c.a<CT[c.t].g))||(t.kind==='feed'&&a.fed===day)||(t.kind==='collect'&&!a.product)){reservedTargets.delete(target.id);t.targets.shift();t.phase=0;queueSave();return}
 if(Math.hypot(companion.x-(target.x*T+8),companion.y-(target.y*T+8))>23){moveCompanion(dt,[target.x,target.y]);t.blocked=(t.blocked||0)+(companion.m?0:dt);if(t.blocked>6){reservedTargets.delete(target.id);t.targets.shift();t.blocked=0;toast('Rainara: Este alvo está sem caminho. Anotei a pendência.')}return}
 companion.m=0;companion.action={type:({water:'water',feed:'feed',collect:'harvest',harvest:'harvest'})[t.kind]};t.phase+=dt;if(t.phase<.35)return;
 if(t.kind==='water'){if(water<=0){t.paused=true;companion.action=null;queueSave();toast('Rainara: Preciso encher o regador antes de continuar.');return}water--;c.w=1;wet[k]=1;t.used++;recordFact('water','farm:'+k,{tile:k});pt(target.x*T+8,target.y*T+8,6,'#93c8ce')}
 else if(t.kind==='feed'){const reserved=missionActive('Q04')?1:0;if(I.racao<=reserved){t.paused=true;companion.action=null;queueSave();toast('Rainara: A ração acabou ou está reservada para o primeiro cuidado.');return}I.racao--;a.fed=day;t.used++;recordFact('careAnimal','feed:'+a.id+':'+day)}
 else if(t.kind==='collect'){const amount=Math.min(a.product,6-t.done),key=a.kind==='chicken'?'ovo':'leite';a.product-=amount;companion.basket[key]=(companion.basket[key]||0)+amount;t.done+=amount-1}
 else {const crop=CT[c.t];if(crop.repeat){c.a=crop.g-crop.repeat;c.w=0}else delete cr[k];companion.basket[crop.k]=(companion.basket[crop.k]||0)+1;recordFact('harvest','farm:'+k,{tile:k})}
 t.done++;reservedTargets.delete(target.id);t.targets.shift();t.phase=0;companion.action=null;queueSave();checkStory()}
function collectBasket(){const keys=Object.keys(companion.basket).filter(k=>companion.basket[k]>0);if(!keys.length){panel('Cesto compartilhado','<p>O cesto está vazio. Produtos das tarefas de Rainara ficam aqui.</p>');return}for(const k of keys){I[k]=(I[k]||0)+companion.basket[k];companion.basket[k]=0}queueSave();openCompanion();hud();toast('Produtos transferidos do cesto para a bolsa.')}
function troughFor(a){return farm.buildings.find(b=>b.id===a.building)}
function fillTrough(id){const b=farm.buildings.find(b=>b.id===id);if(!b||inside||Math.hypot(P.x-(b.x+BUILD[b.kind].w/2)*T,P.y-(b.y+3)*T)>100)return;const amount=Math.min(12-(b.water||0),water);if(amount<=0){toast(water?'Bebedouro cheio.':'Encha o regador no lago.');return}water-=amount;b.water=(b.water||0)+amount;recordFact('careAnimal','trough:'+id+':'+day);queueSave();openShelter(id)}
function openShelter(id){const b=farm.buildings.find(b=>b.id===id);if(!b)return;panel(BUILD[b.kind].n,'<p>Água do bebedouro: '+(b.water||0)+'/12 · regador '+water+'/20</p><button onclick="fillTrough('+id+')">Abastecer com o regador</button>'+farm.animals.filter(a=>a.building===id).map(a=>'<button onclick="openAnimal('+a.id+')">'+esc(a.name)+'</button>').join(''))}
function ensurePipoca(){if(farm.animals.some(a=>a.kind==='chicken'))return;const b=farm.buildings.find(b=>b.kind==='coop'&&(b.water||0)>0&&farm.animals.filter(a=>a.building===b.id).length<BUILD.coop.limit);if(!b||!I.racao)return;const id=farm.nextId++;farm.animals.push({id,building:b.id,kind:'chicken',name:'Pipoca',x:(b.x+2)*T+8,y:(b.y+3)*T+8,fed:-1,pet:-1,product:0,producedDay:day,state:'andar',timer:0});story.flags.pipocaArrived=true;queueSave();toast('Celina trouxe Pipoca. Alimente e faça carinho para conhecê-la.')}
const baseOpenAnimal=openAnimal;openAnimal=function(id){const a=farm.animals.find(a=>a.id===id);if(!a||!animalNear(a))return;baseOpenAnimal(id);const body=$('shop').innerHTML;const close=$('shop').querySelector('.x');const extra=document.createElement('button');extra.textContent='Bebedouro · '+(troughFor(a)?.water||0)+'/12';extra.onclick=()=>openShelter(a.building);$('shop').insertBefore(extra,close);const label=document.createElement('label');label.textContent='Nome do animal';const input=document.createElement('input');input.id='animalName';input.maxLength=20;input.value=a.name;label.append(input);const rename=document.createElement('button');rename.textContent='Guardar nome';rename.onclick=()=>{a.name=cleanName(input.value,20,a.name);queueSave();openAnimal(id)};$('shop').insertBefore(label,close);$('shop').insertBefore(rename,close)};
const baseCare=careAnimal;careAnimal=function(id,action){const a=farm.animals.find(a=>a.id===id);const prior=a?JSON.stringify([a.fed,a.pet,a.product]):'';baseCare(id,action);if(a&&prior!==JSON.stringify([a.fed,a.pet,a.product]))recordFact('careAnimal',action+':'+id+':'+day)};
const baseTool=tool;tool=function(x,y,k){const before={wet:wet[k],crop:cr[k]};baseTool(x,y,k);if(wet[k]&&!before.wet)recordFact('water','farm:'+k,{tile:k});if(cr[k]&&!before.crop)recordFact('plant','farm:'+k,{tile:k})};
// A pausa em um menu não transforma a liberação do toque em outra ação.
const baseClose=closeShop;closeShop=function(){if(scenePlaying){suspendScene();return}baseClose()};

load();initializeStory();renderTerrain();hud();requestAnimationFrame(loop);
</script></body></html>
